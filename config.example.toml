# Copier en config.toml et adapter.

[llm]
# "auto" : Claude Code si `claude` est dans le PATH, sinon OpenRouter (OPENROUTER_API_KEY dans .env).
backend = "auto"

[models]
# Modèles LLM : se choisissent aussi dans l'interface (⚙ Réglages). Une ligne
# décommentée ici passe avant le choix fait dans l'interface.
# Avec OpenRouter, les défauts sont deepseek/deepseek-v4-pro (et deepseek/deepseek-v4.1-flash pour vision).
# translate = "claude-haiku-5-5"
# map = "claude-sonnet-5-5"
# vision = "claude-sonnet-5-5"
# summary = "claude-sonnet-5-5"
# Whisper : laisser commenté pour les valeurs par défaut de la machine.
# Mac Apple Silicon (mlx-whisper) :
# whisper_live = "mlx-community/whisper-large-v3-turbo"
# whisper_fallback = "mlx-community/whisper-small-mlx"
# whisper_final = "mlx-community/whisper-large-v3-mlx"
# Windows / Linux (faster-whisper, GPU NVIDIA utilisé s'il est présent) :
# whisper_live = "large-v3-turbo"
# whisper_fallback = "small"
# whisper_final = "large-v3"

[map]
interval_seconds = 20
min_gap_seconds = 8
max_nodes_per_topic = 8
max_topic_seconds = 300

[paths]
# Dossier des notes ; sans cette ligne : vault Obsidian par défaut, ou choix dans l'interface.
# vault = "~/Documents/Obsidian Vault/Conferences"
# sessions = "~/dev/confmap/sessions"

[server]
host = "0.0.0.0"
port = 8010
